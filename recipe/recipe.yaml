schema_version: 1

context:
  name: ase2sprkkr
  version: "3.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ase2sprkkr-${{ version }}.tar.gz
  sha256: e492a5d96a013910aee576af7a76a7db0afddb9717da423f0b21ecae62072ca5
  patches:
    - pyproject.patch

build:
  number: 0
  skip: not linux
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - ase2sprkkr = ase2sprkkr.tools.ase2sprkkr:run

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake
    - make
  host:
    - python
    - scikit-build-core
    - cython
    - numpy
    - pip
  run:
    - python
    - ase
    - asr
    - spglib
    - pyparsing >=3.0
    - mendeleev
    - platformdirs
    - packaging
    - cython
    - setuptools
    - pint
    - pytest
    - pyyaml
    - requests
    - argcomplete
    - numpy
    - unyt
    - jupyterlab
    - nbconvert
    - nbformat
    - unyts
    - pandas <3.0,>=2.1
    - networkx <3.3  # py>313
    - elementy

tests:
  - python:
      imports:
        - ase2sprkkr
      pip_check: true
  - requirements:
      run:
        - pip
        - argcomplete
    script:
      - register-python-argcomplete ase2sprkkr
      - ase2sprkkr --help

about:
  summary: Wrapper/calculator for SPRKKR to be used within ASE (Atomic Simulation Environment)
  license: MIT
  license_file: LICENCE
  homepage: https://github.com/ase2sprkkr/ase2sprkkr

extra:
  recipe-maintainers:
    - jan-janssen
