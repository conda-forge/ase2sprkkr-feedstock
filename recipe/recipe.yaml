schema_version: 1

context:
  name: ase2sprkkr
  version: "3.4.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ase2sprkkr-${{ version }}.tar.gz
  sha256: 6d19b4bacb1c2f25489654141c44683694beec171264ca583bba75be199e6ca8
  patches:
    - pyproject.patch

build:
  number: 2
  skip: not linux
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - ase2sprkkr = ase2sprkkr.tools.ase2sprkkr:run

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake
    - make
  host:
    - python
    - scikit-build-core
    - cython
    - numpy
    - pip
  run:
    - python
    - ase
    - asr
    - spglib
    - pyparsing >=3.0
    - mendeleev
    - platformdirs
    - packaging
    - cython
    - setuptools
    - pint
    - pytest
    - pyyaml
    - requests
    - argcomplete
    - numpy
    - unyt
    - jupyterlab
    - nbconvert
    - nbformat
    - unyts
    - pandas <3.0,>=2.1
    - networkx <3.3  # py>313

tests:
  - python:
      imports:
        - ase2sprkkr
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - ase2sprkkr --help

about:
  summary: Wrapper/calculator for SPRKKR to be used within ASE (Atomic Simulation Environment)
  license: MIT
  license_file: LICENCE
  homepage: https://github.com/ase2sprkkr/ase2sprkkr

extra:
  recipe-maintainers:
    - jan-janssen
